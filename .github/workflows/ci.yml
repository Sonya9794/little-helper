name: Check and build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Upload Windows portable executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: little-helper-windows-0.0.3
          path: src-tauri/target/release/little-helper.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS development binary (native alpha interaction pending)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: little-helper-macos-0.0.3
          path: src-tauri/target/release/little-helper
          if-no-files-found: error
          retention-days: 7
